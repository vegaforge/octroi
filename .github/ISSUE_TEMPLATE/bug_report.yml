name: Bug report
description: Report a defect in CrawlPay
labels: ['bug']
body:
  - type: markdown
    attributes:
      value: |
        Thanks for filing a bug. For security vulnerabilities, do **not** use this form. See [SECURITY.md](../blob/main/SECURITY.md) instead.
  - type: dropdown
    id: component
    attributes:
      label: Component
      options:
        - facilitator
        - api-gateway
        - web-dashboard
        - proxy-middleware
        - crawler-sdk
        - receipt-signer
        - persistence
        - types
        - contracts
        - other / not sure
    validations:
      required: true
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: Describe the bug and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: Minimal steps, code, or a failing test.
      placeholder: |
        1. ...
        2. ...
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Node version, OS, network (testnet/mainnet), and anything relevant.
    validations:
      required: false
