# Git hooks, managed by lefthook (https://lefthook.dev).
# `pnpm install` installs them through the root `prepare` script.
#
# The split is deliberate:
#   pre-commit  formats only the staged files (seconds)
#   commit-msg  enforces Conventional Commits through commitlint
#   pre-push    runs the preflight without the build (about a minute)

# Make `**` match zero or more directories, as in most other tools. The default
# matcher needs at least one directory, which would skip top-level files.
glob_matcher: doublestar

pre-commit:
  parallel: true
  commands:
    prettier:
      glob: '**/*.{ts,tsx,js,jsx,mjs,cjs,json,md,yml,yaml,css}'
      run: pnpm exec prettier --write --ignore-unknown {staged_files}
      stage_fixed: true
    gofmt:
      glob: 'apps/api-gateway/**/*.go'
      run: gofmt -w {staged_files}
      stage_fixed: true

commit-msg:
  commands:
    commitlint:
      run: pnpm exec commitlint --edit {1}

pre-push:
  commands:
    preflight:
      run: ./scripts/preflight.sh --fast
